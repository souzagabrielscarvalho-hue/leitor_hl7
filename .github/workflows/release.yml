# Release do leitor universal: ao receber uma tag vX.Y.Z (Comandos/release.sh),
# roda os testes, compila o leitor.exe no Windows, confere que ele abre e
# publica a release com o leitor.exe e o leitor.exe.sha256. O painel das
# unidades baixa daqui (shared/painel/atualizacao.py) e exige o SHA-256.
#
# Teste em branch: push em qualquer branch fora da main (ou pull request) faz o
# mesmo, menos publicar: o leitor.exe fica para baixar em "Artifacts" na página
# da execução (Actions). Release só sai de tag.
name: Release do leitor.exe

on:
  push:
    tags: ["v*.*.*"]
    branches-ignore: ["main"]
  pull_request:

permissions:
  contents: write

env:
  # Acentos e ✓/✗ nas mensagens do Python também no Windows.
  PYTHONUTF8: "1"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (janela offscreen nos testes)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Confere a VERSAO e o CHANGELOG (e a tag, se for release)
        run: python Comandos/notas_release.py "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'atual' }}"
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

  leitor:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Notas da release (CHANGELOG)
        run: python Comandos/notas_release.py "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'atual' }}" notas.md
      - name: Compila o leitor.exe
        working-directory: universal
        run: python -m PyInstaller --noconfirm --clean leitor.spec
      - name: Confere que o leitor.exe abre
        # Máquina inexistente: o .exe sobe, recusa e sai com 2 (SAIDA_MAQUINA_DESCONHECIDA).
        run: |
          $p = Start-Process -FilePath universal\dist\leitor.exe -ArgumentList "--maquina", "inexistente" -Wait -PassThru
          if ($p.ExitCode -ne 2) { Write-Error "leitor.exe saiu com $($p.ExitCode) (esperado 2)"; exit 1 }
      - name: SHA-256
        run: |
          Copy-Item universal\dist\leitor.exe leitor.exe
          $hash = (Get-FileHash leitor.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("leitor.exe.sha256", "$hash  leitor.exe`n")
          Write-Host "SHA-256: $hash"
      - name: leitor.exe para baixar (teste em branch)
        uses: actions/upload-artifact@v4
        with:
          name: leitor-${{ github.sha }}
          path: |
            leitor.exe
            leitor.exe.sha256
            notas.md
          retention-days: 14
      - name: Publica a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-execução do workflow: troca os anexos da release que já existe.
            gh release upload $tag leitor.exe leitor.exe.sha256 --clobber
          } else {
            gh release create $tag leitor.exe leitor.exe.sha256 --title $tag.TrimStart("v") --notes-file notas.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
